name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

# Cancel in-progress runs on the same branch to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false          # keep running other versions if one fails
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # -----------------------------------------------------------------------
      # Install core + optional deps in one shot.
      # autogluon is intentionally excluded (too heavy for CI).
      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyyaml lightgbm xgboost shap optuna
          pip install pytest pytest-cov

      - name: Run tests with coverage
        run: |
          pytest genetic_automl/tests/ \
            --ignore=genetic_automl/tests/test_pipeline.py \
            --ignore=genetic_automl/tests/test_extended.py \
            --ignore=genetic_automl/tests/test_improvements.py \
            -v --tb=short \
            --cov=genetic_automl \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false   # coverage upload failure never breaks the build
